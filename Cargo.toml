[package]
name = "avito-browser-bot"
version = "0.1.0"
edition = "2024"
description = "Local Avito listing monitor using an existing Chromium session"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.28"
url = "2"
regex = "1"
sha2 = "0.10"
